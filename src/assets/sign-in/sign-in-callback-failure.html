/*
 * Arcane CLI sign-in result page: the Gate scene from the 3D render's layered set, the result copy in the quiet
 * left third (the approved hatch-refinement composition), and a short, CSS-only light sequence per result.
 * Every state's resting styles are its final frame; the animations only run from dark up to it, so reduced
 * motion shows the final frame at once. The text is never animated. See ops ADR-117, decision 12.
 */
:root { color-scheme: dark; }
* { box-sizing: border-box; }
html { min-height: 100%; background: #050a0f; }
body { margin: 0; }

@property --sweep { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
@property --ring { syntax: "<angle>"; inherits: false; initial-value: 0deg; }

.callback {
  --ink: #edf5fa;
  --ink-2: #e5eff5;
  --muted: #b2c6d2;
  --faint: #acc2d0;
  --line: #436173;
  --light: #a9e8ff;
  --f-display: "Chakra Petch", "Rajdhani", system-ui, sans-serif;
  --f-ui: "Rajdhani", "Chakra Petch", system-ui, sans-serif;
  --f-mono: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
  /* the ring's centre on the 16:9 frame, for the sweeps */
  --ring-x: 62.638%;
  --ring-y: 47.209%;
  /* the failure accent: Arcane UI's warn amber, from the blue neon */
  --amber: sepia(1) saturate(3.2) hue-rotate(-12deg) brightness(1.08);
  position: relative;
  isolation: isolate;
  min-height: 100vh;
  min-height: 100svh;
  overflow: hidden;
  background: #050a0f;
  color: var(--ink);
  font: 400 16px/1.45 var(--f-ui);
}
.callback[data-state="denied"] { --light: #ead3a5; }
.callback[data-state="failure"] { --light: #ffb4a5; }

.callback-micro {
  font: 400 11px/1.5 var(--f-mono);
  letter-spacing: .15em;
  text-transform: uppercase;
  color: var(--faint);
}
.callback-masthead {
  position: relative;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding: 32px 5.5vw 32px 3.5vw;
}
.callback-brand { display: flex; align-items: center; gap: 14px; font: 600 17px/1 var(--f-display); letter-spacing: .34em; }
.callback-brand-mark { width: 32px; height: 32px; flex: none; }

/* ---- the scene: a 16:9 box fitted inside the page, so the light masks stay on the art */
.callback-scene {
  position: absolute;
  inset: 0;
  z-index: -2;
  display: grid;
  place-items: center;
  container-type: size;
}
.callback-scene::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, rgba(5, 10, 15, .25), transparent 29%);
  pointer-events: none;
}
.gate { position: relative; width: min(100cqw, calc(100cqh * 16 / 9)); aspect-ratio: 16 / 9; }
.gate-layer { position: absolute; inset: 0; background: no-repeat 0 0 / 100% 100%; }
.gate-base { background-image: var(--gate-base); }
.gate-seams { background-image: var(--gate-glow-seams); }
.gate-eq { background-image: var(--gate-glow-equalizer); }
.gate-sockets {
  background-image: var(--gate-glow-sockets);
  -webkit-mask-image: conic-gradient(from -15deg at var(--ring-x) var(--ring-y), #000 var(--sweep), transparent 0);
  mask-image: conic-gradient(from -15deg at var(--ring-x) var(--ring-y), #000 var(--sweep), transparent 0);
}
.gate-ring, .gate-flash { background-image: var(--gate-glow-ring); }
.gate-ring {
  -webkit-mask-image: conic-gradient(from 0deg at var(--ring-x) var(--ring-y), #000 calc(var(--ring) - 10deg), transparent var(--ring));
  mask-image: conic-gradient(from 0deg at var(--ring-x) var(--ring-y), #000 calc(var(--ring) - 10deg), transparent var(--ring));
}
.gate-mark { background-image: var(--gate-glow-triangle); }
.gate-seams, .gate-eq, .gate-sockets, .gate-ring, .gate-flash, .gate-mark { mix-blend-mode: plus-lighter; }
.gate-glyphs { position: absolute; inset: 0; width: 100%; height: 100%; filter: drop-shadow(0 0 3px rgba(127, 223, 255, .55)); }

/* ---- the result copy */
.callback-result { position: relative; width: 23.5%; min-width: 300px; margin: clamp(80px, 11vw, 190px) 0 145px 3.5vw; }
.callback-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin: 0;
  min-height: 30px;
  padding: 6px 12px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: rgba(8, 18, 27, .85);
  color: var(--light);
  font: 600 12px/1 var(--f-ui);
  letter-spacing: .08em;
  text-transform: uppercase;
}
.callback-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--light); box-shadow: 0 0 8px var(--light); }
.callback-eyebrow { margin: 27px 0 14px; color: #b5cbd8; }
.callback h1 {
  margin: 0 0 32px;
  max-width: 12ch;
  font: 500 clamp(30px, 3vw, 50px)/1.1 var(--f-display);
  letter-spacing: -.02em;
  text-wrap: balance;
  color: #f2f7fa;
}
.callback-next {
  position: relative;
  max-width: 390px;
  background: linear-gradient(140deg, rgba(72, 100, 119, .67), rgba(40, 66, 80, .47));
  clip-path: polygon(12px 0, calc(100% - 12px) 0, 100% 12px, 100% calc(100% - 12px), calc(100% - 12px) 100%, 12px 100%, 0 calc(100% - 12px), 0 12px);
}
.callback-next::before {
  content: "";
  position: absolute;
  inset: 1px;
  background: rgba(7, 17, 27, .94);
  clip-path: polygon(12px 0, calc(100% - 12px) 0, 100% 12px, 100% calc(100% - 12px), calc(100% - 12px) 100%, 12px 100%, 0 calc(100% - 12px), 0 12px);
}
.callback-next > * { position: relative; }
.callback-next h2 {
  margin: 0;
  padding: 12px 24px;
  border-bottom: 1px solid rgba(42, 62, 88, .9);
  letter-spacing: .17em;
  color: #b8d1df;
  background: linear-gradient(180deg, rgba(159, 184, 214, .05), transparent);
}
.callback-instruction { margin: 0; padding: 22px 24px 6px; font-size: 18px; line-height: 1.5; color: var(--ink-2); }
.callback-detail { margin: 0; padding: 0 24px 22px; font-size: 14px; line-height: 1.6; color: var(--muted); }
.callback-footer {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  display: flex;
  justify-content: space-between;
  gap: 24px;
  padding: 26px 5.5vw 26px 3.5vw;
  border-top: 1px solid rgba(101, 135, 154, .13);
  font-size: 10px;
}
.callback-footer span:last-child { text-align: right; }

/* ---- each result's final frame (what reduced motion shows) */
.callback[data-state="success"] .gate-seams { opacity: 1; }
.callback[data-state="success"] .gate-eq { clip-path: inset(52.837% 0 0 0); }
.callback[data-state="success"] .gate-sockets { --sweep: 360deg; }
.callback[data-state="success"] .gate-ring { --ring: 370deg; }
.callback[data-state="success"] .gate-flash { opacity: 0; }
.callback[data-state="success"] .gate-mark,
.callback[data-state="success"] .gate-glyphs path { opacity: 1; }

.callback[data-state="denied"] .gate-seams { opacity: .45; }
.callback[data-state="denied"] .gate-eq { clip-path: inset(62.469% 0 0 0); }
.callback[data-state="denied"] .gate-sockets { --sweep: 0deg; }
.callback[data-state="denied"] .gate-ring,
.callback[data-state="denied"] .gate-flash,
.callback[data-state="denied"] .gate-mark,
.callback[data-state="denied"] .gate-glyphs path { opacity: 0; }

.callback[data-state="failure"] .gate-seams { opacity: 1; filter: var(--amber); }
.callback[data-state="failure"] .gate-eq { clip-path: inset(61.593% 0 0 0); filter: var(--amber); }
.callback[data-state="failure"] .gate-sockets { opacity: 0; }
.callback[data-state="failure"] .gate-ring { --ring: 370deg; opacity: .6; filter: var(--amber); }
.callback[data-state="failure"] .gate-flash,
.callback[data-state="failure"] .gate-mark,
.callback[data-state="failure"] .gate-glyphs path { opacity: 0; }

/* ---- the light sequences. Equalizer insets: 64.22% shows no bar, and each bar lifts the edge 0.8756%. */
@keyframes gate-fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes gate-fade-standby { from { opacity: 0; } to { opacity: .45; } }
@keyframes gate-eq-full { from { clip-path: inset(64.22% 0 0 0); } to { clip-path: inset(52.837% 0 0 0); } }
@keyframes gate-lock-all { from { --sweep: 0deg; } to { --sweep: 360deg; } }
@keyframes gate-glyph-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes gate-glyph-out { from { opacity: 1; } to { opacity: 0; } }
@keyframes gate-ring-sweep { from { --ring: 0deg; } to { --ring: 370deg; } }
@keyframes gate-strike {
  0% { opacity: 0; }
  18% { opacity: .85; }
  30% { opacity: .12; }
  46% { opacity: 1; }
  58% { opacity: .45; }
  74%, 100% { opacity: 1; }
}
@keyframes gate-flash { 0% { opacity: 0; } 35% { opacity: .65; } 100% { opacity: 0; } }
/* denied, 0.10 to 1.25 s: three bars, held, then down to two */
@keyframes gate-denied-eq {
  0% { clip-path: inset(64.22% 0 0 0); animation-timing-function: steps(3, jump-start); }
  26.09% { clip-path: inset(61.593% 0 0 0); animation-timing-function: step-end; }
  82.61% { clip-path: inset(61.593% 0 0 0); animation-timing-function: steps(1, jump-start); }
  100% { clip-path: inset(62.469% 0 0 0); }
}
/* denied, 0.30 to 1.25 s: sockets 12, 1 and 2 lock, hold, and release in reverse */
@keyframes gate-denied-lock {
  0% { --sweep: 0deg; animation-timing-function: steps(3, jump-start); }
  31.58% { --sweep: 90deg; animation-timing-function: step-end; }
  68.42% { --sweep: 90deg; animation-timing-function: steps(3, jump-start); }
  100% { --sweep: 0deg; }
}
/* failure, 0.10 to 1.25 s: seven bars, held, then down to three */
@keyframes gate-failure-eq {
  0% { clip-path: inset(64.22% 0 0 0); animation-timing-function: steps(7, jump-start); }
