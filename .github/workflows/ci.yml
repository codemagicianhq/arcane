name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rebase-check:
    name: PR branch is rebased on target
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify origin/${{ github.base_ref }} is an ancestor of HEAD
        env:
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE"
          if git merge-base --is-ancestor "origin/$BASE" HEAD; then
            echo "✅ PR branch has origin/$BASE in its history — rebased."
          else
            echo "::error::PR branch is behind origin/$BASE. Rebase before pushing: \`git fetch origin && git rebase origin/$BASE\`. See .arcane/governance/git-conventions.md → '🛑 Agent-mandatory pre-PR guard'."
            exit 1
          fi

  review-round:
    name: Review round clear
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify review round is clear
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: npm run check:review-round

  build-test:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch comparison base
        env:
          BASE: ${{ github.base_ref || 'main' }}
        run: git fetch --no-tags origin "$BASE"

      - name: Verify distributable version bump
        run: npm run check:version-bump

      - name: Verify generated self-host copies
        run: npm run check:self-host-parity

      - name: Verify distributed ADR references
        run: npm run check:adr-references

      - name: Verify spell catalog
        run: npm run check:spell-catalog

      - name: Check show reports (warn mode, SR-02)
        run: npm run check:report
        continue-on-error: true

      # Blocking, unlike check:report above. check:report proves the committed
      # artifacts match a regeneration; it stays warn-mode because a stale
      # artifact is a nuisance. This one proves the TEMPLATE is sound, and a
      # template whose tags name nothing renders an empty page while
      # regenerating byte-identically -- consistently wrong passes every other
      # gate here (arcane-ui 2.1.0 did exactly that).
      - name: Check the report template binds to the data model (SR-06)
        run: npm run check:report-template

      - name: Check citation hygiene (warn mode, LH-07)
        run: npm run check:citations
        continue-on-error: true

      - name: Check stale claims (LH-08; Class A blocks, Class B is report-only)
        run: npm run check:stale-claims

      - name: Check follow-up promotion (warn mode, LH-09)
        run: npm run check:followups
        continue-on-error: true

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build
        env:
          # Private denylist of real venture/customer/machine names (ARC-031).
          # The secret holds the list; enforcement stays public.
          ARCANE_ORG_TOKENS: ${{ secrets.ARCANE_ORG_TOKENS }}
        run: npm run build

      - name: Test
        run: npm run test:coverage

  auth-cross-platform:
    name: Sign-in tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Mock identity and keychain fixtures exercise R3-R10 on each OS.
      # Live tenant and real keychain acceptance checks remain manual.
      - name: Test sign-in and session storage
        run: npm test -- test/credential-store.test.ts test/session-store.test.ts test/login-commands.test.ts test/oidc.test.ts test/oidc-browser-opener.test.ts test/oidc-server-guard.test.ts --testTimeout=20000

  # The full suite above runs only on Linux, whose temp directory is a real
  # path. macOS's is not -- /var/folders/... sits under the /var ->
  # /private/var symlink -- and git reports real paths, which failed 179 tests
  # on a Mac while this workflow stayed green (2026-10-12). The fixture
  # helpers' own tests rebuild that symlink on every OS, so the Linux job
  # guards it too; this job runs against the real thing: those tests, two
  # suites that reach the same mismatch another way (lifecycle's bare mkdtemp,
  # resolve-cli's require.resolve), and the two suites that failed most that
  # day (init-git-state, push-safety).
  fixtures-macos:
    name: Fixture tests (macos-latest)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test fixtures against the default macOS temp directory
        run: npm test -- test/fixture-dir.test.ts test/git-fixture-isolation.test.ts test/resolve-cli.test.ts test/lifecycle.test.ts test/init-git-state.test.ts test/push-safety.test.ts
