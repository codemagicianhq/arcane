name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rebase-check:
    name: PR branch is rebased on target
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify origin/${{ github.base_ref }} is an ancestor of HEAD
        env:
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE"
          if git merge-base --is-ancestor "origin/$BASE" HEAD; then
            echo "✅ PR branch has origin/$BASE in its history — rebased."
          else
            echo "::error::PR branch is behind origin/$BASE. Rebase before pushing: \`git fetch origin && git rebase origin/$BASE\`. See .arcane/governance/git-conventions.md → '🛑 Agent-mandatory pre-PR guard'."
            exit 1
          fi

  review-round:
    name: Review round clear
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify review round is clear
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: npm run check:review-round

  build-test:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch comparison base
        env:
          BASE: ${{ github.base_ref || 'main' }}
        run: git fetch --no-tags origin "$BASE"

      - name: Verify distributable version bump
        run: npm run check:version-bump

      - name: Verify generated self-host copies
        run: npm run check:self-host-parity

      - name: Verify distributed ADR references
        run: npm run check:adr-references

      - name: Verify spell catalog
        run: npm run check:spell-catalog

      - name: Check citation hygiene (warn mode, LH-07)
        run: npm run check:citations
        continue-on-error: true

      - name: Check stale claims (LH-08; Class A blocks, Class B is report-only)
        run: npm run check:stale-claims

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build
        env:
          # Private denylist of real venture/customer/machine names (ARC-031).
          # The secret holds the list; enforcement stays public.
          ARCANE_ORG_TOKENS: ${{ secrets.ARCANE_ORG_TOKENS }}
        run: npm run build

      - name: Test
        run: npm run test:coverage
